# The online preview: a static page with no server behind it. Render builds the LectureQA demo,
# runs the real server on it, records every response into web/src/demo/snapshot.json, and bakes
# that into the page (scripts/preview-capture.mjs, then build:demo). Build it here, never upload a
# dist built on a laptop: the snapshot holds the build machine's demo paths.
services:
  - type: web
    runtime: static
    name: agenttrace-preview
    buildCommand: |
      set -e
      npm ci
      npm run build
      node scripts/preview-capture.mjs
      if grep -q "not captured yet" web/src/demo/snapshot.json; then echo "the preview snapshot is still the placeholder" >&2; exit 1; fi
      npm run build:demo -w web
    staticPublishPath: web/dist-demo
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
